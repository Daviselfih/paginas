<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mis paginas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --text: #f8f0e8;
      --muted: #d4b8a8;
      --accent: #c45c4a;
      --accent-2: #e8a0a0;
      --cherry: #b83b4a;
      --love: #8b5e4b;
      --glass: rgba(28, 18, 16, 0.55);
    }

    html, body {
      min-height: 100%;
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--text);
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
      background-color: #1a1210;
    }

    /* Background image */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: url("image1.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transform: scale(1.05);
      animation: bgDrift 22s ease-in-out infinite alternate;
    }

    @keyframes bgDrift {
      from { transform: scale(1.05) translate(0, 0); }
      to   { transform: scale(1.12) translate(-1.5%, -1%); }
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(ellipse 70% 55% at 50% 40%, rgba(26, 14, 12, 0.35), rgba(12, 8, 6, 0.78)),
        linear-gradient(180deg, rgba(20, 12, 10, 0.4) 0%, rgba(10, 6, 5, 0.7) 100%);
      pointer-events: none;
    }

    /* Soft film grain */
    .grain {
      position: fixed;
      inset: 0;
      z-index: 2;
      opacity: 0.07;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px;
    }

    .card {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 380px;
      background: var(--glass);
      backdrop-filter: blur(18px) saturate(1.2);
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
      border-radius: 28px;
      padding: 36px 28px 32px;
      text-align: center;
      border: 1px solid rgba(245, 235, 224, 0.12);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.2),
        0 24px 56px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      opacity: 0;
      transform: translateY(28px) scale(0.96);
      animation: cardIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
    }

    @keyframes cardIn {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Staggered children */
    .reveal {
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .reveal-1 { animation-delay: 0.45s; }
    .reveal-2 { animation-delay: 0.65s; }
    .reveal-3 { animation-delay: 0.85s; }
    .reveal-4 { animation-delay: 1.05s; }
    .reveal-5 { animation-delay: 1.25s; }

    .photo-wrap {
      width: 140px;
      height: 140px;
      margin: 0 auto 22px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2), #c9a27a);
      box-shadow:
        0 8px 28px rgba(196, 92, 74, 0.35),
        0 0 0 6px rgba(255, 255, 255, 0.04);
      position: relative;
    }

    .photo-wrap::after {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1px solid rgba(232, 160, 160, 0.25);
      animation: ringPulse 3.2s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes ringPulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.06); opacity: 0.15; }
    }

    .photo {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: #2a1c18;
      border: 3px solid rgba(26, 14, 12, 0.6);
    }

    .photo-placeholder {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #2a1c18;
      border: 3px solid rgba(26, 14, 12, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      padding: 12px;
      line-height: 1.35;
    }

    h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.7rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      margin-bottom: 8px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
    }

    .divider {
      width: 40px;
      height: 2px;
      margin: 0 auto 14px;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-2), transparent);
    }

    .handle {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 28px;
      transition: color 0.25s ease, transform 0.2s ease;
    }

    .handle:hover {
      color: var(--accent-2);
      transform: translateY(-1px);
    }

    .handle svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 15px 20px;
      border: none;
      border-radius: 14px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: transform 0.15s ease, box-shadow 0.25s ease, filter 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
    }

    .btn::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.18) 50%, transparent 70%);
      transform: translateX(-120%);
      transition: transform 0.55s ease;
    }

    .btn:hover::after {
      transform: translateX(120%);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-cherry {
      background: linear-gradient(135deg, #d45666, #9e2f3d);
      color: #fff;
      box-shadow: 0 8px 24px rgba(184, 59, 74, 0.45);
    }

    .btn-cherry:hover {
      filter: brightness(1.08);
      box-shadow: 0 10px 28px rgba(184, 59, 74, 0.55);
    }

    .btn-libro {
      background: linear-gradient(135deg, #a6785c, #6b4536);
      color: #f5ebe0;
      box-shadow: 0 8px 24px rgba(107, 69, 54, 0.45);
    }

    .btn-libro:hover {
      filter: brightness(1.1);
      box-shadow: 0 10px 28px rgba(107, 69, 54, 0.55);
    }

    /* Decorative corner accents */
    .corner {
      position: absolute;
      width: 28px;
      height: 28px;
      opacity: 0.35;
      pointer-events: none;
    }

    .corner-tl {
      top: 14px;
      left: 14px;
      border-top: 1.5px solid var(--accent-2);
      border-left: 1.5px solid var(--accent-2);
      border-radius: 4px 0 0 0;
    }

    .corner-br {
      bottom: 14px;
      right: 14px;
      border-bottom: 1.5px solid var(--accent-2);
      border-right: 1.5px solid var(--accent-2);
      border-radius: 0 0 4px 0;
    }

    @media (max-width: 400px) {
      .card {
        padding: 28px 20px 26px;
        border-radius: 22px;
      }
      .photo-wrap {
        width: 120px;
        height: 120px;
      }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="bg-overlay" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main class="card">
    <span class="corner corner-tl" aria-hidden="true"></span>
    <span class="corner corner-br" aria-hidden="true"></span>

    <div class="photo-wrap reveal reveal-1">
      <img
        class="photo"
        src="photo.jpg"
        alt=""
        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
      />
      <div class="photo-placeholder" style="display:none;">
        Agrega<br />photo.jpg
      </div>
    </div>

    <h1 class="reveal reveal-2">Davi</h1>
    <div class="divider reveal reveal-2" aria-hidden="true"></div>

    <a class="handle reveal reveal-3" href="https://instagram.com/jdss.av" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
      </svg>
      @jdss.av
    </a>

    <div class="buttons">
      <a class="btn btn-cherry reveal reveal-4" href="cherrylanita/" id="btnCherry">Cherry</a>
      <a class="btn btn-libro reveal reveal-5" href="librodeamor/" id="btnLibro">Libro de amor</a>
    </div>
  </main>
</body>
</html>
